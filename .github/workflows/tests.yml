name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  bats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install bats and shellcheck
        run: sudo apt-get update && sudo apt-get install -y bats shellcheck
      - name: Shellcheck
        run: shellcheck -s bash --severity=warning scripts/*.sh tests/test_helper.bash
      - name: Run tests
        run: bats tests
